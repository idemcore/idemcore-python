name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests (mocked API, no network)
        run: python -m unittest discover -s tests -v
      - name: Live smoke test (GET /health only)
        env:
          IDEMCORE_LIVE: "1"
        run: python -m unittest tests.test_client.LiveSmoke -v
