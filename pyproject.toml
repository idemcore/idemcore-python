[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idemcore"
dynamic = ["version"]
description = "Python client for the Idemcore API: chat completions with signed receipts, and local receipt verification."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Don Wick", email = "don.wick@idemcore.net" }]
keywords = ["llm", "inference", "receipts", "verification", "reproducibility", "openai-compatible"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["idemcore-verify>=0.3.0", "cryptography>=41"]

[project.urls]
Homepage = "https://idemcore.net"
Documentation = "https://idemcore.net/docs"
Verifier = "https://github.com/idemcore/idemcore-verifier"

[tool.setuptools.dynamic]
version = { attr = "idemcore._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idemcore = ["py.typed"]
